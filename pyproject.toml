[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "granger"
version = "0.1.0"
description = "Extract figures (with or without captions) from books"
requires-python = ">=3.11"
dependencies = ["pymupdf", "pillow", "numpy", "scipy", "mobi"]

[project.scripts]
granger = "granger.cli:main"

[tool.setuptools]
packages = ["granger"]
